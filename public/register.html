<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration — WasteWise Portal</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/index.html">
        <i class="bi bi-recycle text-success fs-3"></i>
        <span>WasteWise</span>
      </a>
      <div>
        <a href="/index.html" class="btn btn-outline-secondary btn-sm me-2">
          <i class="bi bi-arrow-left me-1"></i> Home
        </a>
        <a href="/login.html" class="btn btn-outline-primary btn-sm">
          Already Registered? Log In
        </a>
      </div>
    </div>
  </nav>

  <!-- Register Form Container -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        
        <div class="card shadow-md border-0 rounded-4 overflow-hidden">
          <div class="card-header bg-white pt-4 pb-2 border-0 text-center">
            <div class="stat-icon bg-success-subtle text-success mx-auto mb-2">
              <i class="bi bi-person-plus"></i>
            </div>
            <h4 class="fw-bold text-dark">Citizen Registration</h4>
            <p class="text-muted small">Create your household or commercial account for doorstep waste pickup services</p>
          </div>

          <div class="card-body p-4 pt-2">
            <form id="registerForm" novalidate>
              <div class="row g-3">
                
                <!-- Full Name -->
                <div class="col-md-6">
                  <label for="name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="name" required placeholder="e.g. Aarav Sharma" minlength="2">
                </div>

                <!-- Phone Number -->
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold small">Phone Number <span class="text-danger">*</span></label>
                  <input type="tel" class="form-control" id="phone" required placeholder="10-digit mobile number" pattern="[0-9+\-\s()]{10,15}">
                </div>

                <!-- Email Address -->
                <div class="col-12">
                  <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="email" required placeholder="aarav@example.com">
                </div>

                <!-- Passwords -->
                <div class="col-md-6">
                  <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="password" required placeholder="At least 6 characters" minlength="6">
                </div>
                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="confirmPassword" required placeholder="Repeat your password">
                </div>

                <!-- Address Details -->
                <div class="col-12 mt-4">
                  <h6 class="fw-bold text-muted border-bottom pb-2 small text-uppercase">Pickup Address Information</h6>
                </div>

                <div class="col-12">
                  <label for="street" class="form-label fw-semibold small">Street Address / Apartment</label>
                  <input type="text" class="form-control" id="street" placeholder="Flat / House No., Building Name, Street">
                </div>

                <div class="col-md-4">
                  <label for="city" class="form-label fw-semibold small">City</label>
                  <input type="text" class="form-control" id="city" placeholder="e.g. Bengaluru" value="Bengaluru">
                </div>

                <div class="col-md-4">
                  <label for="state" class="form-label fw-semibold small">State</label>
                  <input type="text" class="form-control" id="state" placeholder="e.g. Karnataka" value="Karnataka">
                </div>

                <div class="col-md-4">
                  <label for="postalCode" class="form-label fw-semibold small">Postal / PIN Code</label>
                  <input type="text" class="form-control" id="postalCode" placeholder="e.g. 560001">
                </div>

                <div class="col-12 mt-4">
                  <div class="form-check small text-muted">
                    <input class="form-check-input" type="checkbox" id="terms" required checked>
                    <label class="form-check-label" for="terms">
                      I agree to the municipal segregation rules and commit to presenting segregated recyclable waste.
                    </label>
                  </div>
                </div>

                <div class="col-12 mt-3">
                  <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">
                    <i class="bi bi-check-circle me-1"></i> Create Citizen Account
                  </button>
                </div>
              </div>
            </form>
          </div>

          <div class="card-footer bg-light py-3 text-center border-0 small">
            <span class="text-muted">Already have an account?</span>
            <a href="/login.html" class="fw-bold text-success text-decoration-none ms-1">Log in here</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white py-3 border-top mt-auto text-center small text-muted">
    WasteWise Portal — College Web Technology IA3 Project
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/public.js"></script>
</body>
</html>
